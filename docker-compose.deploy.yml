services:
  db:
    ports: !override
      - "127.0.0.1:${DB_HOST_PORT:-8181}:5432"

  lensee.host:
    ports: !reset []

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: lensee_caddy
    restart: always
    cpus: "0.15"
    mem_limit: 128m
    depends_on:
      - frontend
      - lensee.host
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
