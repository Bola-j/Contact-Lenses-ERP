<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (() => {
        const language = localStorage.getItem("lensee.language") === "en" ? "en" : "ar";
        document.documentElement.lang = language === "ar" ? "ar-EG" : "en";
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      })();
    </script>
    <title>Lensee</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary">
        <a class="brand" href="#/dashboard" aria-label="Lensee dashboard">
          <span class="brand-mark">L</span>
          <span>Lensee</span>
        </a>
        <nav id="nav" class="nav"></nav>
        <div id="session" class="session"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Open navigation" aria-expanded="false" title="Open navigation">☰</button>
          <div>
            <p class="eyebrow" id="route-label">Dashboard</p>
            <h1 id="page-title">Operations Console</h1>
          </div>
          <div class="topbar-actions">
            <span id="health-pill" class="status-pill status-muted">Checking API</span>
            <button id="language-toggle" class="button secondary language-toggle" data-no-translate type="button" aria-label="Switch to Arabic" title="Switch to Arabic">العربية</button>
            <button id="logout-button" class="button secondary logout-button" type="button">Sign out</button>
          </div>
        </header>

        <section id="notification-area" class="notice-area" aria-live="polite"></section>
        <section id="view" class="view"></section>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
