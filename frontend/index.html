<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./bootstrap-language.js?v=20260922-phase5"></script>
    <title>Lensee</title>
    <link rel="stylesheet" href="./styles.css?v=20260922-phase5">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary" data-i18n-aria-label="navigation.primary">
        <a class="brand" href="#/dashboard" aria-label="Lensee dashboard" data-i18n-aria-label="navigation.dashboard">
          <span>Lensee</span>
        </a>
        <nav id="nav" class="nav"></nav>
        <div id="session" class="session"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Open navigation" data-i18n-aria-label="navigation.open" aria-expanded="false" title="Open navigation" data-i18n-title="navigation.open">&#9776;</button>
          <div>
            <p class="eyebrow" id="route-label">Dashboard</p>
            <h1 id="page-title">Operations Console</h1>
          </div>
          <div class="topbar-actions">
            <span id="health-pill" class="status-pill status-muted">Checking API</span>
            <button id="language-toggle" class="button secondary language-toggle" data-no-translate type="button" aria-label="Switch to Arabic" title="Switch to Arabic">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</button>
            <button id="logout-button" class="button secondary logout-button" type="button" data-i18n="common.signOut">Sign out</button>
          </div>
        </header>

        <section id="notification-area" class="notice-area" aria-live="polite"></section>
        <section id="view" class="view"></section>
      </main>
    </div>

    <script src="./app.js?v=20260924-i18n-final" type="module"></script>
  </body>
</html>
