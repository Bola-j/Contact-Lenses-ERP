name: Setup certification environment
description: Install the .NET and Node toolchains plus frontend dependencies for CI jobs.

inputs:
  playwright:
    description: Install Chromium and its Linux dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 8.0.x
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 20
        cache: npm
    - name: Install frontend dependencies
      shell: bash
      run: npm ci
    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
