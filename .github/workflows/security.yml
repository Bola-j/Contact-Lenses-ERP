name: Security Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Security / CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  sbom-and-image-scan:
    name: Security / SBOM and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build candidate API image
        run: docker build --pull -f backend/Lensee.Host/Dockerfile -t lensee-api:${{ github.sha }} .

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: lensee-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate Trivy SARIF evidence
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lensee-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-evidence
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Gate High and Critical image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lensee-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
