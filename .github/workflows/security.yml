name: Security Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-and-image-scan:
    name: Security / SBOM and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build candidate API image
        run: docker build --pull -f backend/Lensee.Host/Dockerfile -t lensee-api:${{ github.sha }} .

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: lensee-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate Trivy SARIF evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lensee-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-security-evidence
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Gate High and Critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lensee-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
