name: Certification Evidence

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: certification-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  certify-release-candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/reusable-certification.yml
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      release_run: true
      source_ci_event: ${{ github.event.workflow_run.event }}
      source_ci_branch: ${{ github.event.workflow_run.head_branch }}
      source_ci_repository: ${{ github.event.workflow_run.head_repository.full_name }}
      source_ci_sha: ${{ github.event.workflow_run.head_sha }}
      source_ci_conclusion: ${{ github.event.workflow_run.conclusion }}
      source_ci_run_id: ${{ github.event.workflow_run.id }}
    permissions:
      contents: read
      actions: read
      packages: write
