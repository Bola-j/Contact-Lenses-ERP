name: Full UI Certification

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional exact commit to certify (must be on main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    uses: ./.github/workflows/reusable-certification.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha || github.sha }}
      release_run: false
      source_ci_event: ${{ github.event_name }}
      source_ci_branch: ${{ github.ref_name }}
      source_ci_repository: ${{ github.repository }}
      source_ci_sha: ${{ inputs.candidate_sha || github.sha }}
      source_ci_conclusion: not-applicable
      source_ci_run_id: ${{ github.run_id }}
    permissions:
      contents: read
      actions: read
      packages: write
