name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-format:
    name: Build, test, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-certification
      - run: dotnet restore Lensee.slnx
      - run: dotnet build Lensee.slnx --configuration Release --no-restore -warnaserror
      - run: dotnet test backend/Lensee.Tests/Lensee.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"
      - name: PostgreSQL integration tests
        env:
          LENSEE_RUN_POSTGRES_TESTS: "true"
        run: dotnet test backend/Lensee.PostgresIntegrationTests/Lensee.PostgresIntegrationTests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"
      - name: Formatting and frontend guards
        run: |
          dotnet format Lensee.slnx --verify-no-changes --no-restore
          npm run check
      - name: Deterministic frontend build
        env:
          LENSEE_API_BASE_URL: http://127.0.0.1:5000
        run: npm run vercel:build

  seeded-e2e:
    name: Seeded browser acceptance
    needs: build-test-format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-certification
        with:
          playwright: "true"
      - name: Seed and run isolated browser flows
        env:
          LENSEE_E2E_SKIP_WEBSERVER: "1"
        run: |
          pwsh -NoProfile -File scripts/e2e-setup.ps1
          npm run e2e -- --project=chromium
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seeded-e2e-evidence
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: warn
      - name: Collect isolated service logs
        if: always()
        run: docker compose -p lensee-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color

  phase0-3-certification:
    name: Phase 0-3 isolated certification
    needs: build-test-format
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-certification
        with:
          playwright: "true"
      - run: pwsh -NoProfile -File scripts/verify-phase0-3-runtime.ps1
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-3-certification-evidence
          path: |
            artifacts/certification/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn

  phase4-10-certification:
    name: Phase 4-10 isolated certification
    needs: build-test-format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-certification
        with:
          playwright: "true"
      - run: pwsh -NoProfile -File scripts/verify-phase4-10.ps1 -IncludeRuntime -IncludeBrowser -IncludeRecovery
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase4-10-certification-evidence
          path: |
            artifacts/certification/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn

  dependency-review:
    # GitHub does not provide Dependency Review for private repositories without
    # Advanced Security. Keep the review gate for public PRs and avoid a
    # guaranteed platform-level failure for private repositories.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false

  sbom-and-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate API image
        run: docker build --pull -f backend/Lensee.Host/Dockerfile -t lensee-api:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: lensee-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Scan High and Critical image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lensee-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-evidence
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn
      - name: Upload Trivy SARIF
        if: always()
        # Code scanning may be unavailable on private repositories. The SARIF
        # artifact above remains the evidence record; Trivy itself still fails
        # this job for High/Critical findings.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
