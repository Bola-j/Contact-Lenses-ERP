services:
  db:
    image: postgres:17-alpine
    container_name: lensee_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lensee
      POSTGRES_USER: lensee_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SomeStrongPassword123!}
    ports:
      - "8181:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensee_user -d lensee"]
      interval: 10s
      timeout: 5s
      retries: 5

  lensee.host:
    image: ${DOCKER_REGISTRY-}lenseehost
    build:
      context: .
      dockerfile: backend/Lensee.Host/Dockerfile
    container_name: lensee_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lensee;Username=lensee_user;Password=${DB_PASSWORD:-SomeStrongPassword123!}
      Jwt__Secret: ${JWT_SECRET:-x7kP9mQw2nRjLvBsYdHcZeAuFgTiWoNp}
      Jwt__Issuer: Lensee
      Jwt__Audience: Lensee.App
      Shopify__Enabled: ${SHOPIFY_ENABLED:-false}
      Shopify__WebhookSecret: ${SHOPIFY_WEBHOOK_SECRET:-}
      Shopify__LegacyWebhookPathSecret: ${SHOPIFY_LEGACY_WEBHOOK_PATH_SECRET:-}
      Shopify__StoreDomain: ${SHOPIFY_STORE_DOMAIN:-}
      Shopify__OnlineLocationId: ${SHOPIFY_ONLINE_LOCATION_ID:-00000000-0000-0000-0000-000000000000}
      Shopify__CodGatewayNames__0: ${SHOPIFY_COD_GATEWAY_NAME_1:-Cash on Delivery}
      Shopify__MaxBodyBytes: ${SHOPIFY_WEBHOOK_MAX_BODY_BYTES:-262144}
      Shopify__PayloadRetentionDays: ${SHOPIFY_PAYLOAD_RETENTION_DAYS:-30}
      Hosting__TrustedProxyNetwork: ${HOSTING_TRUSTED_PROXY_NETWORK:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}
      Database__BaselineExistingSchema: ${DATABASE_BASELINE_EXISTING_SCHEMA:-true}
      RateLimiting__PermitLimit: ${RATE_LIMITING_PERMIT_LIMIT:-120}
      RateLimiting__WindowSeconds: ${RATE_LIMITING_WINDOW_SECONDS:-60}
      RateLimiting__QueueLimit: ${RATE_LIMITING_QUEUE_LIMIT:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"
    volumes:
      - data_protection:/home/app/.aspnet/DataProtection-Keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lensee_web
    restart: unless-stopped
    environment:
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:5000}
    command: >
      /bin/sh -c "printf 'window.LENSEE_CONFIG = { apiBaseUrl: \"%s\" };'
      \"$${FRONTEND_API_BASE_URL}\" > /usr/share/nginx/html/config.js &&
      nginx -g 'daemon off;'"
    depends_on:
      - lensee.host
    ports:
      - "${FRONTEND_PORT:-3001}:80"

volumes:
  pgdata:
  data_protection:
