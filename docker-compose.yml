services:
  db:
    image: postgres:17-alpine
    container_name: lensee_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lensee
      POSTGRES_USER: lensee_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SomeStrongPassword123!}
    ports:
      - "8181:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensee_user -d lensee"]
      interval: 10s
      timeout: 5s
      retries: 5

  lensee.host:
    image: ${DOCKER_REGISTRY-}lenseehost
    build:
      context: .
      dockerfile: backend/Lensee.Host/Dockerfile
    container_name: lensee_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lensee;Username=lensee_user;Password=${DB_PASSWORD:-SomeStrongPassword123!}
      Jwt__Secret: ${JWT_SECRET:-x7kP9mQw2nRjLvBsYdHcZeAuFgTiWoNp}
      Jwt__Issuer: Lensee
      Jwt__Audience: Lensee.App
      Shopify__Enabled: ${SHOPIFY_ENABLED:-false}
      Shopify__WebhookSecret: ${SHOPIFY_WEBHOOK_SECRET:-}
      Shopify__LegacyWebhookPathSecret: ${SHOPIFY_LEGACY_WEBHOOK_PATH_SECRET:-}
      Shopify__StoreDomain: ${SHOPIFY_STORE_DOMAIN:-}
      Shopify__OnlineLocationId: ${SHOPIFY_ONLINE_LOCATION_ID:-00000000-0000-0000-0000-000000000000}
      Shopify__CodGatewayNames__0: ${SHOPIFY_COD_GATEWAY_NAME_1:-Cash on Delivery}
      Shopify__MaxBodyBytes: ${SHOPIFY_WEBHOOK_MAX_BODY_BYTES:-262144}
      Shopify__PayloadRetentionDays: ${SHOPIFY_PAYLOAD_RETENTION_DAYS:-30}
      Hosting__TrustedProxyNetwork: ${HOSTING_TRUSTED_PROXY_NETWORK:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_LOOPBACK:-http://127.0.0.1:3001}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-false}
      Database__BaselineExistingSchema: ${DATABASE_BASELINE_EXISTING_SCHEMA:-false}
      Telemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RateLimiting__AnonymousPermitLimit: ${RATE_LIMITING_ANONYMOUS_PERMIT_LIMIT:-60}
      RateLimiting__AuthenticatedPermitLimit: ${RATE_LIMITING_AUTHENTICATED_PERMIT_LIMIT:-600}
      RateLimiting__WindowSeconds: ${RATE_LIMITING_WINDOW_SECONDS:-60}
      RateLimiting__QueueLimit: ${RATE_LIMITING_QUEUE_LIMIT:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"
    volumes:
      - data_protection:/home/app/.aspnet/DataProtection-Keys

  migrator:
    image: ${DOCKER_REGISTRY-}lenseehost
    build:
      context: .
      dockerfile: backend/Lensee.Host/Dockerfile
    profiles: ["migrate"]
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lensee;Username=lensee_user;Password=${DB_PASSWORD:-SomeStrongPassword123!}
      Jwt__Secret: ${JWT_SECRET:-x7kP9mQw2nRjLvBsYdHcZeAuFgTiWoNp}
      Jwt__Issuer: Lensee
      Jwt__Audience: Lensee.App
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lensee_web
    restart: unless-stopped
    environment:
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:5000}
    command: >
      /bin/sh -c "printf 'window.LENSEE_CONFIG = { apiBaseUrl: \"%s\" };'
      \"$${FRONTEND_API_BASE_URL}\" > /usr/share/nginx/html/config.js &&
      nginx -g 'daemon off;'"
    depends_on:
      - lensee.host
    ports:
      - "${FRONTEND_PORT:-3001}:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

volumes:
  pgdata:
  data_protection:
  prometheus_data:
  grafana_data:
