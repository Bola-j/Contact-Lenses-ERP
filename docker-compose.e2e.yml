name: lensee-e2e

services:
  db:
    container_name: lensee_e2e_db
    cpus: "0.75"
    mem_limit: 768m
    environment:
      POSTGRES_DB: lensee_e2e
      POSTGRES_USER: lensee_e2e_user
      POSTGRES_PASSWORD: ${LENSEE_E2E_DB_PASSWORD:-e2e-only-db-password-2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensee_e2e_user -d lensee_e2e"]
    ports: !override
      - "127.0.0.1:${LENSEE_E2E_DB_PORT:-58181}:5432"
    volumes: !override
      - lensee_e2e_pgdata:/var/lib/postgresql/data

  lensee.host:
    container_name: lensee_e2e_api
    cpus: "1.00"
    mem_limit: 1024m
    environment:
      ASPNETCORE_ENVIRONMENT: E2E
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lensee_e2e;Username=lensee_e2e_user;Password=${LENSEE_E2E_DB_PASSWORD:-e2e-only-db-password-2026}
      Jwt__Secret: ${LENSEE_E2E_JWT_SECRET:-e2e-only-jwt-secret-not-for-production-2026}
      Jwt__Issuer: Lensee.E2E
      Jwt__Audience: Lensee.E2E
      Cors__AllowedOrigins__0: http://127.0.0.1:${LENSEE_E2E_FRONTEND_PORT:-53001}
      Cors__AllowedOrigins__1: http://localhost:${LENSEE_E2E_FRONTEND_PORT:-53001}
      # A serial browser acceptance run hydrates several authenticated workspaces
      # from the same loopback address. Keep rate limiting enabled, but give the
      # dedicated, non-production test stack enough headroom to exercise it.
      RateLimiting__AnonymousPermitLimit: 300
      RateLimiting__AuthenticatedPermitLimit: 5000
      Database__AutoMigrate: "false"
      Database__BaselineExistingSchema: "false"
      Shopify__Enabled: "false"
    ports: !override
      - "127.0.0.1:${LENSEE_E2E_API_PORT:-55000}:8080"
    volumes: !override
      - lensee_e2e_data_protection:/home/app/.aspnet/DataProtection-Keys

  migrator:
    container_name: lensee_e2e_migrator
    cpus: "0.75"
    mem_limit: 1024m
    environment:
      ASPNETCORE_ENVIRONMENT: E2E
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lensee_e2e;Username=lensee_e2e_user;Password=${LENSEE_E2E_DB_PASSWORD:-e2e-only-db-password-2026}
      Jwt__Secret: ${LENSEE_E2E_JWT_SECRET:-e2e-only-jwt-secret-not-for-production-2026}
      Jwt__Issuer: Lensee.E2E
      Jwt__Audience: Lensee.E2E
      Database__AutoMigrate: "false"
      Database__BaselineExistingSchema: "false"
      Shopify__Enabled: "false"
    volumes: !override
      - lensee_e2e_data_protection:/home/app/.aspnet/DataProtection-Keys

  frontend:
    container_name: lensee_e2e_web
    cpus: "0.10"
    mem_limit: 128m
    environment:
      FRONTEND_API_BASE_URL: http://127.0.0.1:${LENSEE_E2E_API_PORT:-55000}
    ports: !override
      - "127.0.0.1:${LENSEE_E2E_FRONTEND_PORT:-53001}:80"
    volumes:
      - ./frontend/nginx-e2e.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: lensee-e2e-network

volumes:
  lensee_e2e_pgdata:
    name: lensee-e2e-pgdata
  lensee_e2e_data_protection:
    name: lensee-e2e-data-protection
