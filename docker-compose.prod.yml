services:
  db:
    restart: always
    environment:
      POSTGRES_DB: lensee
      POSTGRES_USER: lensee_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports: []

  lensee.host:
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lensee;Username=lensee_user;Password=${DB_PASSWORD:?DB_PASSWORD is required}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-Lensee}
      Jwt__Audience: ${JWT_AUDIENCE:-Lensee.App}
      DataProtection__KeyRingPath: /home/app/.aspnet/DataProtection-Keys
      Shopify__Enabled: ${SHOPIFY_ENABLED:-false}
      Shopify__WebhookSecret: ${SHOPIFY_WEBHOOK_SECRET:-}
      Shopify__LegacyWebhookPathSecret: ${SHOPIFY_LEGACY_WEBHOOK_PATH_SECRET:-}
      Shopify__StoreDomain: ${SHOPIFY_STORE_DOMAIN:-}
      Shopify__OnlineLocationId: ${SHOPIFY_ONLINE_LOCATION_ID:-00000000-0000-0000-0000-000000000000}
      Shopify__CodGatewayNames__0: ${SHOPIFY_COD_GATEWAY_NAME_1:-Cash on Delivery}
      Shopify__MaxBodyBytes: ${SHOPIFY_WEBHOOK_MAX_BODY_BYTES:-262144}
      Shopify__PayloadRetentionDays: ${SHOPIFY_PAYLOAD_RETENTION_DAYS:-30}
      Hosting__TrustedProxyNetwork: ${HOSTING_TRUSTED_PROXY_NETWORK:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-false}
      Database__BaselineExistingSchema: ${DATABASE_BASELINE_EXISTING_SCHEMA:-false}
      Telemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RateLimiting__AnonymousPermitLimit: ${RATE_LIMITING_ANONYMOUS_PERMIT_LIMIT:-60}
      RateLimiting__AuthenticatedPermitLimit: ${RATE_LIMITING_AUTHENTICATED_PERMIT_LIMIT:-600}
      RateLimiting__WindowSeconds: ${RATE_LIMITING_WINDOW_SECONDS:-60}
      RateLimiting__QueueLimit: ${RATE_LIMITING_QUEUE_LIMIT:-0}

  frontend:
    restart: always
    environment:
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:?FRONTEND_API_BASE_URL is required}
